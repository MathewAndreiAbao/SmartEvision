<!doctype html>
<html lang="en">

<head>
    <script>(function(){var t=localStorage.getItem('cedims-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')})();</script>
    <style>
        :root {
            --color-surface: #f5f6f8;
            --color-surface-white: #fff;
            --color-surface-muted: #ebedf0;
            --color-surface-raised: #ffffff;
            --color-surface-overlay: rgba(0,0,0,0.04);
            --color-text-primary: #1a202c;
            --color-text-secondary: #4a5568;
            --color-text-muted: #718096;
            --color-border-subtle: #e2e8f0;
            --color-border-strong: #cbd5e0;
            --color-primary: #0038A8;
            --color-primary-dark: #002d86;
            --color-primary-light: #e8eef9;
            --color-primary-text: #ffffff;
            --color-compliant: #16a34a;
            --color-compliant-bg: #f0fdf4;
            --color-compliant-border: #bbf7d0;
            --color-late: #d97706;
            --color-late-bg: #fffbeb;
            --color-late-border: #fde68a;
            --color-missing: #dc2626;
            --color-missing-bg: #fef2f2;
            --color-missing-border: #fecaca;
            --color-supplementary: #7c3aed;
            --color-supplementary-bg: #f5f3ff;
            --color-supplementary-border: #ddd6fe;
            --chart-grid: #e2e8f0;
            --chart-compliant: #16a34a;
            --chart-late: #d97706;
            --chart-missing: #dc2626;
            --chart-supplementary: #7c3aed;
            --chart-neutral: #64748b;
            --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-modal: 0 20px 60px rgba(0,0,0,0.15);
            --shadow-dropdown: 0 4px 12px rgba(0,0,0,0.10);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
        }
        .dark {
            --color-surface: #08080b;
            --color-surface-white: #0d0d14;
            --color-surface-muted: #12121c;
            --color-surface-raised: #0d0d14;
            --color-surface-overlay: rgba(255,255,255,0.04);
            --color-text-primary: #ededf0;
            --color-text-secondary: #9d9db0;
            --color-text-muted: #585870;
            --color-border-subtle: #1e1e2e;
            --color-border-strong: #2a2a40;
            --color-primary: #4a7de8;
            --color-primary-dark: #3366cc;
            --color-primary-light: #1a2040;
            --color-primary-text: #ffffff;
            --color-compliant: #4ade80;
            --color-compliant-bg: #052e16;
            --color-compliant-border: #166534;
            --color-late: #fbbf24;
            --color-late-bg: #1c1400;
            --color-late-border: #92400e;
            --color-missing: #f87171;
            --color-missing-bg: #1c0000;
            --color-missing-border: #991b1b;
            --color-supplementary: #a78bfa;
            --color-supplementary-bg: #1e0040;
            --color-supplementary-border: #5b21b6;
            --chart-grid: #1e1e2e;
            --shadow-card: 0 1px 3px rgba(0,0,0,0.30);
            --shadow-modal: 0 20px 60px rgba(0,0,0,0.50);
            --shadow-dropdown: 0 4px 20px rgba(0,0,0,0.40);
        }
    </style>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a3a5c" />
    <meta name="description"
        content="CEDIMS — Calapan East District Instructional Monitoring System. A DepEd-aligned platform for DLL submission, compliance tracking, and instructional supervision." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CEDIMS" />
    <meta name="application-name" content="CEDIMS" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/app_icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/app_icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
