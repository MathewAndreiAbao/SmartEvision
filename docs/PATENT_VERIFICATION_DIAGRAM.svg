<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="tier1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tier2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="result-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="result-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef2f2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fecaca;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-lg" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">FIG. 4 — CRYPTOGRAPHIC VERIFICATION SYSTEM</text>

  <!-- ===== QR SCANNING ZONE ===== -->
  <rect x="30" y="50" width="440" height="280" rx="10" fill="url(#tier2)" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="250" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">QR CODE SCANNING</text>

  <!-- Document with QR -->
  <rect x="60" y="90" width="130" height="100" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="115" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e293b">Document with</text>
  <text x="125" y="130" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e293b">QR Code</text>
  <!-- QR placeholder -->
  <rect x="90" y="140" width="70" height="35" rx="4" fill="#000000"/>
  <rect x="95" y="145" width="60" height="25" rx="2" fill="#ffffff"/>
  <text x="125" y="161" text-anchor="middle" font-size="5" fill="#000000">■ ■ ■ ■</text>

  <line x1="190" y1="140" x2="230" y2="140" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Scanner -->
  <rect x="235" y="90" width="150" height="100" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="310" y="112" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">QR Scanner</text>
  <text x="310" y="128" text-anchor="middle" font-size="9" fill="#475569">Camera scan or</text>
  <text x="310" y="143" text-anchor="middle" font-size="9" fill="#475569">image upload</text>
  <text x="310" y="163" text-anchor="middle" font-size="8" fill="#64748b">jsQR + BarcodeDetector</text>

  <line x1="385" y1="140" x2="410" y2="140" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Parse URL -->
  <rect x="60" y="210" width="380" height="50" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">Parse Verification URL</text>
  <text x="250" y="250" text-anchor="middle" font-size="9" fill="#475569">Format: {APP_URL}/verify/{SHA256_HASH} → Extract hash</text>

  <!-- Arrow to Tier 1 -->
  <line x1="250" y1="260" x2="250" y2="295" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="280" font-size="9" fill="#64748b">Hash transmitted</text>

  <!-- ===== TIER 1 — OFFLINE CACHE ===== -->
  <rect x="30" y="300" width="440" height="200" rx="10" fill="url(#tier1)" stroke="#86efac" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="250" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">TIER 1 — OFFLINE CACHE CHECK</text>

  <rect x="60" y="340" width="380" height="60" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="362" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">Query IndexedDB Cache</text>
  <text x="250" y="380" text-anchor="middle" font-size="9" fill="#475569">Key: cached_docs_{SHA256_HASH}</text>
  <text x="250" y="395" text-anchor="middle" font-size="9" fill="#64748b">Populated by preloadVerificationHashes() on login</text>

  <line x1="250" y1="400" x2="250" y2="420" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-g)"/>

  <!-- Decision -->
  <polygon points="250,425 310,460 250,495 190,460" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="458" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97706">Cached?</text>

  <!-- Found → Result A -->
  <line x1="310" y1="460" x2="530" y2="460" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-g)"/>
  <text x="380" y="452" text-anchor="middle" font-size="9" fill="#16a34a">Found (cached)</text>

  <!-- Not Found → Tier 2 -->
  <line x1="190" y1="460" x2="100" y2="460" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="100" y1="460" x2="100" y2="540" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-r)"/>
  <text x="85" y="500" text-anchor="end" font-size="9" fill="#ea580c">Cache miss</text>

  <!-- ===== RESULT A: VERIFIED ===== -->
  <rect x="520" y="420" width="180" height="80" rx="8" fill="url(#result-g)" stroke="#16a34a" stroke-width="2" filter="url(#shadow-lg)"/>
  <text x="610" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">✓ VERIFIED</text>
  <text x="610" y="463" text-anchor="middle" font-size="9" fill="#475569">Hash matches</text>
  <text x="610" y="480" text-anchor="middle" font-size="8" fill="#64748b">Display: file_name, doc_type,</text>
  <text x="610" y="494" text-anchor="middle" font-size="8" fill="#64748b">submission date, teacher, school</text>

  <!-- ===== TIER 2 — SERVER DB ===== -->
  <rect x="30" y="510" width="440" height="200" rx="10" fill="url(#tier2)" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="250" y="532" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">TIER 2 — SERVER DATABASE QUERY</text>

  <rect x="60" y="550" width="380" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="572" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">Query Supabase submissions Table</text>
  <text x="250" y="590" text-anchor="middle" font-size="9" fill="#475569">WHERE file_hash = {hash}</text>
  <text x="250" y="605" text-anchor="middle" font-size="9" fill="#64748b">Joins: profiles (teacher_name, school_name)</text>

  <line x1="250" y1="610" x2="250" y2="630" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <polygon points="250,635 310,670 250,705 190,670" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="668" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97706">Record</text>
  <text x="250" y="682" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97706">Found?</text>

  <!-- Found → Result A -->
  <line x1="310" y1="670" x2="520" y2="670" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-g)"/>
  <text x="380" y="662" text-anchor="middle" font-size="9" fill="#16a34a">Found on server</text>

  <!-- Not Found → Result B -->
  <line x1="190" y1="670" x2="80" y2="670" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="80" y1="670" x2="80" y2="720" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-r)"/>

  <!-- ===== FINAL RESULTS ===== -->
  <rect x="520" y="630" width="180" height="80" rx="8" fill="url(#result-r)" stroke="#dc2626" stroke-width="2" filter="url(#shadow-lg)"/>
  <text x="610" y="655" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">✗ NOT FOUND</text>
  <text x="610" y="673" text-anchor="middle" font-size="9" fill="#475569">No record matches hash</text>
  <text x="610" y="690" text-anchor="middle" font-size="8" fill="#64748b">Document unverified</text>
  <text x="610" y="704" text-anchor="middle" font-size="8" fill="#64748b">Possible forgery</text>

  <!-- ===== HASH FLOW ARROW ===== -->
  <path d="M 250 260 L 250 310" stroke="none"/>

  <!-- ===== LEGEND ===== -->
  <rect x="750" y="50" width="220" height="250" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="860" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">QUERY RESULTS</text>
  <line x1="770" y1="82" x2="930" y2="82" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="770" y="95" width="14" height="14" rx="3" fill="#16a34a"/>
  <text x="790" y="107" font-size="10" font-weight="bold" fill="#16a34a">VERIFIED</text>
  <text x="770" y="122" font-size="9" fill="#475569">Display document metadata:</text>
  <text x="775" y="137" font-size="8" fill="#64748b">• File name and type</text>
  <text x="775" y="149" font-size="8" fill="#64748b">• Compliance status</text>
  <text x="775" y="161" font-size="8" fill="#64748b">• Submission date</text>
  <text x="775" y="173" font-size="8" fill="#64748b">• Teacher name</text>
  <text x="775" y="185" font-size="8" fill="#64748b">• School name</text>
  <text x="775" y="197" font-size="8" fill="#64748b">• Grade level</text>

  <rect x="770" y="215" width="14" height="14" rx="3" fill="#dc2626"/>
  <text x="790" y="227" font-size="10" font-weight="bold" fill="#dc2626">NOT FOUND</text>
  <text x="770" y="242" font-size="9" fill="#475569">Display unverified result</text>
  <text x="770" y="257" font-size="9" fill="#475569">No action available</text>

  <!-- Info box -->
  <rect x="750" y="320" width="220" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="860" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">ARCHITECTURE NOTES</text>
  <line x1="770" y1="352" x2="930" y2="352" stroke="#e2e8f0" stroke-width="1"/>
  <text x="770" y="370" font-size="9" fill="#475569">• No authentication required</text>
  <text x="770" y="387" font-size="9" fill="#475569">  for verification page</text>
  <text x="770" y="407" font-size="9" fill="#475569">• Offline cache populated by</text>
  <text x="770" y="422" font-size="9" fill="#475569">  preloadVerificationHashes()</text>
  <text x="770" y="442" font-size="9" fill="#475569">• IndexedDB keys:</text>
  <text x="775" y="457" font-size="8" fill="#64748b">  cached_docs_{hash}</text>
  <text x="770" y="475" font-size="9" fill="#475569">• DB query checks</text>
  <text x="770" y="490" font-size="9" fill="#475569">  file_hash column</text>
  <text x="770" y="508" font-size="9" fill="#475569">  with unique index</text>

  <!-- Bottom label -->
  <text x="500" y="740" text-anchor="middle" font-size="10" fill="#64748b">FIG. 4 — The verification system first checks local IndexedDB cache, then falls back to server database query.</text>
</svg>
