<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="bg-online" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bg-offline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7ed;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffedd5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bg-sync" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f3ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ede9fe;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-lg" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">FIG. 5 — OFFLINE-FIRST QUEUING AND AUTO-SYNC SYSTEM</text>

  <!-- ===== ONLINE FLOW (Left) ===== -->
  <rect x="30" y="50" width="460" height="340" rx="10" fill="url(#bg-online)" stroke="#86efac" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="260" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">ONLINE FLOW</text>

  <!-- Pipeline stages 1-6 -->
  <rect x="60" y="95" width="400" height="65" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="260" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Pipeline Stages 1-6 Execute Normally</text>
  <text x="260" y="133" text-anchor="middle" font-size="9" fill="#475569">Transcode → Compress → OCR → Hash (Worker) → QR Stamp (Worker) → Compliance</text>
  <text x="260" y="150" text-anchor="middle" font-size="8" fill="#64748b">All executed client-side regardless of connectivity</text>

  <line x1="260" y1="160" x2="260" y2="185" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Upload -->
  <rect x="110" y="190" width="300" height="55" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="260" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">Stage 8a: Upload to Server</text>
  <text x="260" y="230" text-anchor="middle" font-size="9" fill="#475569">POST /api/storage/upload → Backblaze B2</text>

  <line x1="260" y1="245" x2="260" y2="270" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- DB Insert -->
  <rect x="110" y="275" width="300" height="55" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="260" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">Database Record Inserted</text>
  <text x="260" y="315" text-anchor="middle" font-size="9" fill="#475569">file_hash, metadata, compliance_status</text>

  <line x1="260" y1="330" x2="260" y2="355" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Success -->
  <rect x="155" y="360" width="210" height="25" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="260" y="377" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">✓ SUCCESS</text>

  <!-- ===== OFFLINE FLOW (Right) ===== -->
  <rect x="530" y="50" width="540" height="340" rx="10" fill="url(#bg-offline)" stroke="#fdba74" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="800" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#ea580c">OFFLINE FLOW</text>

  <!-- Pipeline stages 1-6 -->
  <rect x="560" y="95" width="480" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Pipeline Stages 1-6 Execute Normally</text>
  <text x="800" y="132" text-anchor="middle" font-size="9" fill="#475569">Transcode → Compress → OCR → Hash → QR Stamp → Compliance (all client-side)</text>

  <line x1="800" y1="145" x2="800" y2="170" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Queue to IndexedDB -->
  <rect x="560" y="175" width="480" height="70" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow-lg)"/>
  <text x="800" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#ea580c">Stage 8b: Enqueue to IndexedDB</text>
  <text x="800" y="215" text-anchor="middle" font-size="9" fill="#475569">Key pattern: sync_queue_{timestamp}_{shortHash}</text>
  <text x="800" y="232" text-anchor="middle" font-size="9" fill="#475569">Items: pdfBytes, fileHash, rawText, options (userId, docType, week, subject, calendarId)</text>

  <!-- Queue detail box -->
  <rect x="600" y="255" width="400" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="800" y="273" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e293b">Queue Management</text>
  <text x="800" y="289" text-anchor="middle" font-size="8" fill="#475569">• Duplicate hash prevention (keys checked before insert)</text>
  <text x="800" y="303" text-anchor="middle" font-size="8" fill="#475569">• SharedArrayBuffer converted to plain Uint8Array for IndexedDB compatibility</text>
  <text x="800" y="317" text-anchor="middle" font-size="8" fill="#475569">• pendingSyncCount updated in writable store + app badge</text>

  <line x1="800" y1="320" x2="800" y2="345" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Pending -->
  <rect x="710" y="350" width="180" height="25" rx="12" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
  <text x="800" y="367" text-anchor="middle" font-size="10" font-weight="bold" fill="#ea580c">⏳ PENDING SYNC</text>

  <!-- ===== SYNC TRIGGERS (Bottom) ===== -->
  <rect x="30" y="410" width="1040" height="180" rx="10" fill="url(#bg-sync)" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="550" y="435" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">AUTO-SYNC TRIGGERS</text>

  <!-- Trigger 1 -->
  <rect x="60" y="455" width="225" height="60" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="172" y="477" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">Trigger 1: Online Event</text>
  <text x="172" y="495" text-anchor="middle" font-size="9" fill="#475569">window.addEventListener('online', ...)</text>
  <text x="172" y="508" text-anchor="middle" font-size="8" fill="#64748b">+ 3-second stabilization delay</text>

  <!-- Trigger 2 -->
  <rect x="305" y="455" width="225" height="60" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="417" y="477" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">Trigger 2: Visibility Change</text>
  <text x="417" y="495" text-anchor="middle" font-size="9" fill="#475569">document.addEventListener(</text>
  <text x="417" y="508" text-anchor="middle" font-size="9" fill="#475569">'visibilitychange', ...)</text>

  <!-- Trigger 3 -->
  <rect x="550" y="455" width="225" height="60" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="662" y="477" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">Trigger 3: Window Focus</text>
  <text x="662" y="495" text-anchor="middle" font-size="9" fill="#475569">window.addEventListener(</text>
  <text x="662" y="508" text-anchor="middle" font-size="9" fill="#475569">'focus', ...)</text>

  <!-- Trigger 4 -->
  <rect x="795" y="455" width="245" height="60" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="917" y="477" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">Trigger 4: Periodic Heartbeat</text>
  <text x="917" y="495" text-anchor="middle" font-size="9" fill="#475569">setInterval(processQueue, 60000)</text>
  <text x="917" y="508" text-anchor="middle" font-size="8" fill="#64748b">Every 60 seconds (battery-friendly)</text>

  <!-- Arrows from triggers to processor -->
  <path d="M 172 515 L 172 545 L 550 545 L 550 565" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 417 515 L 417 530 L 550 530 L 550 565" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 662 515 L 662 530 L 550 530" stroke="#7c3aed" stroke-width="1.5" fill="none"/>
  <path d="M 917 515 L 917 530 L 550 530 L 550 565" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== QUEUE PROCESSOR ===== -->
  <rect x="270" y="570" width="560" height="200" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow-lg)"/>
  <text x="550" y="595" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">QUEUE PROCESSOR (processQueue)</text>

  <rect x="300" y="610" width="500" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="628" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">Step 1: Get all queue items sorted by timestamp (idb-keyval keys → filter → sort)</text>
  <text x="550" y="642" text-anchor="middle" font-size="8" fill="#64748b">Array.filter(k => k.startsWith('sync_queue_'))</text>

  <line x1="550" y1="650" x2="550" y2="665" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="670" width="500" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="688" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">Step 2: Re-validate slot uniqueness + hash uniqueness on server</text>
  <text x="550" y="702" text-anchor="middle" font-size="8" fill="#64748b">Check teaching_load_id + week_number + doc_type + school_year, and file_hash against submissions table</text>

  <line x1="550" y1="710" x2="550" y2="725" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="730" width="500" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="749" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">Step 3: Upload to /api/storage/upload → Step 4: Insert DB record → Step 5: Delete queue item</text>

  <!-- Results -->
  <rect x="320" y="770" width="200" height="30" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="420" y="790" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">✓ success++ → remove from queue</text>

  <rect x="580" y="770" width="200" height="30" rx="12" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="680" y="790" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">✗ failed++ → keep for retry</text>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="620" width="200" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="130" y="642" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">LEGEND</text>
  <line x1="50" y1="652" x2="210" y2="652" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="50" y="665" width="12" height="12" rx="3" fill="#16a34a"/>
  <text x="70" y="675" font-size="9" fill="#475569">Online / Success flow</text>

  <rect x="50" y="690" width="12" height="12" rx="3" fill="#ea580c"/>
  <text x="70" y="700" font-size="9" fill="#475569">Offline / Pending flow</text>

  <rect x="50" y="715" width="12" height="12" rx="3" fill="#7c3aed"/>
  <text x="70" y="725" font-size="9" fill="#475569">Sync trigger / Processor</text>

  <rect x="50" y="740" width="12" height="12" rx="3" fill="#dc2626"/>
  <text x="70" y="750" font-size="9" fill="#475569">Failure / Keep for retry</text>

  <text x="500" y="840" text-anchor="middle" font-size="10" fill="#64748b">FIG. 5 — The offline-first system preserves the full pipeline, queues in IndexedDB, and auto-processes on connectivity restore via 4 trigger mechanisms.</text>
</svg>
