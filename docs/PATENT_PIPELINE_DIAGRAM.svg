<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <linearGradient id="client-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="server-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="verify-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef2f2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fee2e2;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">FIG. 1 — EDUCATIONAL DOCUMENT PROCESSING PIPELINE — HIGH-LEVEL ARCHITECTURE</text>

  <!-- ===================== CLIENT DEVICE ZONE ===================== -->
  <rect x="20" y="50" width="760" height="700" rx="10" fill="url(#client-bg)" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="400" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">CLIENT DEVICE (Web Browser)</text>

  <!-- Stage 1: Document Receipt -->
  <rect x="50" y="95" width="160" height="65" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">STAGE 1</text>
  <text x="130" y="135" text-anchor="middle" font-size="10" fill="#475569">Document Receipt</text>
  <text x="130" y="150" text-anchor="middle" font-size="9" fill="#64748b">File picker / drag-drop</text>

  <!-- Arrow 1→2 -->
  <line x1="210" y1="127" x2="240" y2="127" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Transcoding -->
  <rect x="245" y="95" width="160" height="65" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="325" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">STAGE 2</text>
  <text x="325" y="135" text-anchor="middle" font-size="10" fill="#475569">Format Transcoding</text>
  <text x="325" y="150" text-anchor="middle" font-size="9" fill="#64748b">DOCX → PDF (DOCX→PDF)</text>

  <!-- Stage 2 arrows to server proxy -->
  <line x1="325" y1="160" x2="325" y2="185" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Transcoding details box -->
  <rect x="245" y="188" width="160" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="325" y="206" text-anchor="middle" font-size="9" fill="#2563eb">Primary: /api/convert</text>
  <text x="325" y="220" text-anchor="middle" font-size="9" fill="#64748b">LibreOffice headless</text>
  <text x="325" y="234" text-anchor="middle" font-size="8" fill="#ea580c">Fallback: Google Apps Script</text>

  <!-- Arrow 2→3 -->
  <line x1="405" y1="127" x2="435" y2="127" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Compression -->
  <rect x="440" y="95" width="150" height="65" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="515" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">STAGE 3</text>
  <text x="515" y="135" text-anchor="middle" font-size="10" fill="#475569">PDF Compression</text>
  <text x="515" y="150" text-anchor="middle" font-size="9" fill="#64748b">pdf-lib optimization</text>

  <!-- Arrow 3→4 -->
  <line x1="590" y1="127" x2="620" y2="127" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: OCR -->
  <rect x="625" y="95" width="140" height="65" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="695" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">STAGE 4</text>
  <text x="695" y="135" text-anchor="middle" font-size="10" fill="#475569">Text Extraction + OCR</text>
  <text x="695" y="150" text-anchor="middle" font-size="9" fill="#64748b">PDF.js → Tesseract.js</text>

  <!-- Stage 4 inline detail -->
  <rect x="625" y="168" width="140" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="695" y="185" text-anchor="middle" font-size="8" fill="#2563eb">Regex + Dice Coeff</text>
  <text x="695" y="198" text-anchor="middle" font-size="8" fill="#2563eb">+ Naive Bayes</text>

  <!-- Arrow 4→5 (going down) -->
  <line x1="695" y1="233" x2="695" y2="270" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="710" y="255" font-size="9" fill="#64748b">Metadata extracted</text>

  <!-- Stage 5: Hashing & Web Worker -->
  <rect x="440" y="275" width="170" height="75" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="525" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">STAGE 5 (Web Worker)</text>
  <text x="525" y="315" text-anchor="middle" font-size="10" fill="#475569">COMPRESS_AND_HASH</text>
  <text x="525" y="332" text-anchor="middle" font-size="9" fill="#64748b">SHA-256 via Web Crypto API</text>
  <text x="525" y="345" text-anchor="middle" font-size="9" fill="#64748b">Dedup: IndexedDB + Server</text>

  <!-- Arrow 4→5 -->
  <line x1="695" y1="208" x2="695" y2="240" stroke="none"/>

  <!-- Stage 5 arrow from Stage 4 -->
  <path d="M 625 213 L 620 213 L 620 312 L 610 312" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="265" text-anchor="end" font-size="8" fill="#64748b">Transfer to</text>
  <text x="600" y="278" text-anchor="end" font-size="8" fill="#64748b">Worker thread</text>

  <!-- Arrow 5→6 -->
  <line x1="525" y1="350" x2="525" y2="385" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 6: QR Generation & Stamp -->
  <rect x="440" y="390" width="170" height="75" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="525" y="413" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">STAGE 6 (Web Worker)</text>
  <text x="525" y="430" text-anchor="middle" font-size="10" fill="#475569">STAMP_QR</text>
  <text x="525" y="447" text-anchor="middle" font-size="9" fill="#64748b">QR: /verify/{SHA256_HASH}</text>
  <text x="525" y="460" text-anchor="middle" font-size="9" fill="#64748b">72px, 30px margin, bottom-right</text>

  <!-- Arrow 6→7 -->
  <line x1="525" y1="465" x2="525" y2="500" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 7: Compliance -->
  <rect x="440" y="505" width="170" height="75" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="525" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">STAGE 7</text>
  <text x="525" y="545" text-anchor="middle" font-size="10" fill="#475569">Compliance Determination</text>
  <text x="525" y="562" text-anchor="middle" font-size="9" fill="#64748b">Calendar deadline + grace</text>
  <text x="525" y="575" text-anchor="middle" font-size="9" fill="#64748b">→ compliant / late / non-compliant</text>

  <!-- Arrow 7→Decision -->
  <line x1="525" y1="580" x2="525" y2="615" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Network Available? -->
  <polygon points="525,620 580,660 525,700 470,660" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="525" y="658" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97706">Network</text>
  <text x="525" y="672" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97706">Available?</text>

  <!-- Decision → Yes (Stage 8a) -->
  <line x1="580" y1="660" x2="690" y2="660" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="635" y="652" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">YES</text>

  <!-- Stage 8a: Upload Online -->
  <rect x="695" y="625" width="180" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="785" y="648" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">STAGE 8a — ONLINE</text>
  <text x="785" y="665" text-anchor="middle" font-size="10" fill="#475569">Upload to /api/storage/upload</text>
  <text x="785" y="682" text-anchor="middle" font-size="9" fill="#64748b">→ Backblaze B2 + DB insert</text>

  <!-- Decision → No (Stage 8b) -->
  <line x1="470" y1="660" x2="360" y2="660" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="415" y="652" text-anchor="middle" font-size="10" font-weight="bold" fill="#ea580c">NO</text>

  <!-- Stage 8b: Offline Queue -->
  <rect x="180" y="625" width="175" height="70" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="267" y="648" text-anchor="middle" font-size="11" font-weight="bold" fill="#ea580c">STAGE 8b — OFFLINE</text>
  <text x="267" y="665" text-anchor="middle" font-size="10" fill="#475569">Queue to IndexedDB</text>
  <text x="267" y="682" text-anchor="middle" font-size="9" fill="#64748b">Deferred: auto-sync later</text>

  <!-- Offline → Online arrow -->
  <path d="M 355 690 Q 450 750 695 690" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>
  <text x="525" y="740" text-anchor="middle" font-size="9" fill="#ea580c">On connectivity restore: auto-process queue</text>

  <!-- ===================== SERVER INFRASTRUCTURE ZONE ===================== -->
  <rect x="790" y="50" width="390" height="350" rx="10" fill="url(#server-bg)" stroke="#86efac" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="985" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">SERVER INFRASTRUCTURE</text>

  <!-- Supabase -->
  <rect x="810" y="95" width="170" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="895" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">Supabase Backend</text>
  <line x1="830" y1="127" x2="960" y2="127" stroke="#e2e8f0" stroke-width="1"/>
  <text x="895" y="142" text-anchor="middle" font-size="9" fill="#475569">PostgreSQL Database</text>
  <text x="895" y="157" text-anchor="middle" font-size="9" fill="#475569">Auth Service (JWT)</text>
  <text x="895" y="172" text-anchor="middle" font-size="9" fill="#475569">Row-Level Security</text>
  <text x="895" y="187" text-anchor="middle" font-size="9" fill="#475569">(Teacher / School Head / DS)</text>

  <!-- Backblaze B2 -->
  <rect x="810" y="215" width="170" height="75" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="895" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">Cloud Storage</text>
  <text x="895" y="255" text-anchor="middle" font-size="9" fill="#475569">Backblaze B2 (S3-compatible)</text>
  <text x="895" y="270" text-anchor="middle" font-size="9" fill="#64748b">Path: submissions/{u}/{t}/{f}</text>

  <!-- Server Proxy -->
  <rect x="810" y="300" width="170" height="85" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="895" y="323" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">Server Proxy Endpoints</text>
  <text x="895" y="340" text-anchor="middle" font-size="9" fill="#475569">POST /api/convert</text>
  <text x="895" y="355" text-anchor="middle" font-size="9" fill="#475569">POST /api/storage/upload</text>
  <text x="895" y="370" text-anchor="middle" font-size="9" fill="#475569">GET /api/storage/presign</text>

  <!-- Google Apps Script -->
  <rect x="1000" y="95" width="160" height="80" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1080" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">Fallback Service</text>
  <text x="1080" y="135" text-anchor="middle" font-size="9" fill="#475569">Google Apps Script</text>
  <text x="1080" y="152" text-anchor="middle" font-size="8" fill="#64748b">Drive API + Docs API</text>
  <text x="1080" y="167" text-anchor="middle" font-size="8" fill="#64748b">Base64 DOCX → PDF</text>

  <!-- Arrows from client to server -->
  <path d="M 695 575 L 810 575 L 810 190 L 980 190" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <path d="M 695 575 L 810 575 L 810 300 L 980 300" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- ===================== VERIFICATION ZONE ===================== -->
  <rect x="790" y="420" width="390" height="180" rx="10" fill="url(#verify-bg)" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="985" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">VERIFICATION (Any Time / Any Party)</text>

  <!-- Verify Page -->
  <rect x="810" y="460" width="170" height="70" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="895" y="483" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">Verify Page</text>
  <text x="895" y="500" text-anchor="middle" font-size="9" fill="#475569">/verify/{hash}</text>
  <text x="895" y="515" text-anchor="middle" font-size="9" fill="#64748b">No auth required</text>

  <!-- QR Scanner -->
  <rect x="810" y="540" width="170" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="895" y="560" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">QR Scanner</text>
  <text x="895" y="575" text-anchor="middle" font-size="9" fill="#475569">jsQR + BarcodeDetector API</text>

  <!-- Verification Logic -->
  <rect x="1000" y="460" width="160" height="130" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1080" y="483" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">Verification Logic</text>
  <line x1="1020" y1="492" x2="1140" y2="492" stroke="#fecaca" stroke-width="1"/>
  <text x="1080" y="508" text-anchor="middle" font-size="9" fill="#475569">1. Offline cache check</text>
  <text x="1080" y="524" text-anchor="middle" font-size="9" fill="#64748b">(IndexedDB)</text>
  <text x="1080" y="542" text-anchor="middle" font-size="9" fill="#475569">2. Server DB query</text>
  <text x="1080" y="558" text-anchor="middle" font-size="9" fill="#64748b">(Supabase submissions)</text>
  <text x="1080" y="578" text-anchor="middle" font-size="9" fill="#475569">→ Verified / Not Found</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="790" y="620" width="390" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="985" y="642" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">LEGEND</text>
  <rect x="810" y="655" width="16" height="16" rx="3" fill="#3b82f6"/>
  <text x="835" y="668" font-size="10" fill="#475569">Pipeline stage</text>
  <rect x="970" y="655" width="16" height="16" rx="3" fill="#7c3aed"/>
  <text x="995" y="668" font-size="10" fill="#475569">Web Worker operation</text>
  <polygon points="810,690 820,680 830,690 820,700" fill="#f59e0b"/>
  <text x="840" y="693" font-size="10" fill="#475569">Decision point</text>
  <rect x="970" y="683" width="16" height="16" rx="3" fill="#059669"/>
  <text x="995" y="696" font-size="10" fill="#475569">Compliance check</text>
  <rect x="810" y="713" width="16" height="16" rx="3" fill="#dc2626"/>
  <text x="835" y="726" font-size="10" fill="#475569">Verification</text>
  <line x1="975" y1="720" x2="1000" y2="720" stroke="#16a34a" stroke-width="2"/>
  <text x="1010" y="723" font-size="10" fill="#16a34a">Online path</text>
  <line x1="810" y1="738" x2="835" y2="738" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="845" y="741" font-size="10" fill="#ea580c">Offline / deferred path</text>
</svg>
